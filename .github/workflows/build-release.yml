name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  BUNDLED_NODE_VERSION: '22.12.0'

jobs:
  build:
    name: build (${{ matrix.platform }} / ${{ matrix.variant }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        variant: [plain, bundled]
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            node_platform: win-x64
            node_file: node.exe
            node_ext: zip
          - platform: macos-14
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
            node_file: node
            node_ext: tar.gz
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64
            node_file: node
            node_ext: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install server (dsh) deps
        run: npm --prefix server ci

      # 仅 bundled 变体：下载目标平台预编译 Node 放入 src-tauri/binaries/，
      # 命名遵循 Tauri externalBin 规则：node-<target-triple>(.exe)
      - name: Download bundled Node.js
        if: matrix.variant == 'bundled'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nodejs.org/dist/v${{ env.BUNDLED_NODE_VERSION }}"
          DIR="node-v${{ env.BUNDLED_NODE_VERSION }}-${{ matrix.node_platform }}"
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          if [ "${{ matrix.node_ext }}" = "zip" ]; then
            curl -fsSL -o /tmp/node.zip "$BASE/$DIR.zip"
            unzip -q /tmp/node.zip -d /tmp
          else
            curl -fsSL -o /tmp/node.tgz "$BASE/$DIR.tar.gz"
            tar -xzf /tmp/node.tgz -C /tmp
          fi
          cp "/tmp/$DIR/${{ matrix.node_file }}" \
            "$GITHUB_WORKSPACE/src-tauri/binaries/node-${{ matrix.target }}"
          chmod +x "$GITHUB_WORKSPACE/src-tauri/binaries/node-${{ matrix.target }}" || true

      - name: Prepare variant config
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/ci-prepare.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          buildOnly: true
          args: --verbose

      # 两个变体在相同平台会生成同名安装包，统一追加变体后缀，避免 Release 资产冲突
      - name: Rename artifacts with variant suffix
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              ext="${base##*.}"
              stem="${base%.${ext}}"
              mv "$f" "$(dirname "$f")/${stem}-${{ matrix.variant }}.${ext}"
            done

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.variant }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # 推送 tag（v*）时汇聚所有安装包发布 Release；手动触发仅产出 artifacts 供调试
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f -exec ls -lh {} \;

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.msi
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
          generate_release_notes: true
