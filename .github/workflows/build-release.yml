name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'
  BUNDLED_NODE_VERSION: '22.12.0'

jobs:
  build:
    name: build (${{ matrix.platform }} / ${{ matrix.variant }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # 显式列出 3 平台 × 2 变体（plain=未捆绑 Node / bundled=捆绑 Node）共 6 个组合，
      # 避免顶层数组与 include 混用时矩阵展开不完整
      matrix:
        include:
          - platform: windows-latest
            variant: plain
            target: x86_64-pc-windows-msvc
            node_platform: win-x64
            node_file: node.exe
            node_ext: zip
            args: --verbose
          - platform: windows-latest
            variant: bundled
            target: x86_64-pc-windows-msvc
            node_platform: win-x64
            node_file: node.exe
            node_ext: zip
            args: --verbose
          - platform: macos-14
            variant: plain
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
            node_file: node
            node_ext: tar.gz
            args: --verbose
          - platform: macos-14
            variant: bundled
            target: aarch64-apple-darwin
            node_platform: darwin-arm64
            node_file: node
            node_ext: tar.gz
            args: --verbose
          - platform: ubuntu-22.04
            variant: plain
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64
            node_file: node
            node_ext: tar.gz
            # AppImage 的 linuxdeploy 会对 resources 中的二进制做依赖部署，
            # server/node_modules 包含大量原生文件会导致 patchelf 失败，故仅打 deb+rpm
            args: --verbose --bundles deb,rpm
          - platform: ubuntu-22.04
            variant: bundled
            target: x86_64-unknown-linux-gnu
            node_platform: linux-x64
            node_file: node
            node_ext: tar.gz
            args: --verbose --bundles deb,rpm
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Install server (dsh) deps
        run: npm --prefix server ci

      # 仅 bundled 变体：下载目标平台预编译 Node 放入 src-tauri/binaries/，
      # 命名遵循 Tauri externalBin 规则：node-<target-triple>(.exe)。
      # 注意：zip 包的可执行文件在根目录，tar.gz 包的在 bin/ 子目录。
      - name: Download bundled Node.js
        if: matrix.variant == 'bundled'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nodejs.org/dist/v${{ env.BUNDLED_NODE_VERSION }}"
          DIR="node-v${{ env.BUNDLED_NODE_VERSION }}-${{ matrix.node_platform }}"
          mkdir -p "$GITHUB_WORKSPACE/src-tauri/binaries"
          if [ "${{ matrix.node_ext }}" = "zip" ]; then
            curl -fsSL -o /tmp/node.zip "$BASE/$DIR.zip"
            unzip -q /tmp/node.zip -d /tmp
            SRC="/tmp/$DIR/${{ matrix.node_file }}"
            DST="node-${{ matrix.target }}.exe"
          else
            curl -fsSL -o /tmp/node.tgz "$BASE/$DIR.tar.gz"
            tar -xzf /tmp/node.tgz -C /tmp
            SRC="/tmp/$DIR/bin/${{ matrix.node_file }}"
            DST="node-${{ matrix.target }}"
          fi
          cp "$SRC" "$GITHUB_WORKSPACE/src-tauri/binaries/$DST"
          chmod +x "$GITHUB_WORKSPACE/src-tauri/binaries/$DST" || true

      - name: Prepare variant config
        env:
          VARIANT: ${{ matrix.variant }}
        run: node scripts/ci-prepare.mjs

      # 可选：配置 Apple Developer ID 签名 + 公证所需的 secrets（未配置则跳过）。
      # 配置后 Tauri 会自动对 .app 签名并提交公证，Gatekeeper 完全放行，无需用户 xattr 绕过。
      # 需在仓库 Settings → Secrets 配置：APPLE_CERTIFICATE(p12 base64)、APPLE_CERTIFICATE_PASSWORD、
      # APPLE_SIGNING_IDENTITY(证书名，如 "Developer ID Application: xxx")、APPLE_ID、APPLE_PASSWORD(app专用)、APPLE_TEAM_ID。
      - name: Inject Apple signing secrets
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT != ''
        env:
          HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 未提供 tagName，tauri-action 只构建不发布（发布由 release job 统一处理）
          args: ${{ matrix.args }}

      # 两个变体在相同平台会生成同名安装包，统一追加变体后缀，避免 Release 资产冲突
      - name: Rename artifacts with variant suffix
        shell: bash
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
            -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              ext="${base##*.}"
              stem="${base%.${ext}}"
              mv "$f" "$(dirname "$f")/${stem}-${{ matrix.variant }}.${ext}"
            done

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-${{ matrix.variant }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error

  # 推送 tag（v*）时汇聚所有安装包发布 Release；手动触发仅产出 artifacts 供调试
  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: find dist -type f -exec ls -lh {} \;

      # glob 精确匹配安装包（DeepSeek* 前缀 + 平台扩展名），
      # 避免误传构建中间产物（如 winpty-agent/OpenConsole 等 exe）
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/DeepSeek*setup*.exe
            dist/**/DeepSeek*.msi
            dist/**/DeepSeek*.dmg
            dist/**/DeepSeek*.deb
            dist/**/DeepSeek*.rpm
          generate_release_notes: true
